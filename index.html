<style>
/* Layout: una columna, superficies planas, líneas finas, un solo acento azul; mono para numeración. */

    --bg:#0f1215;--surface:#161a1e;--line:#272d33;--fg:#e7eaed;--muted:#8f9ba6;
    --accent:#7ea3f2;--accent-ink:#0f1215;--sel:#1b2536;
    --ok:#4cc38a;--ok-bg:#12261c;--bad:#f0776b;--bad-bg:#2b1613;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1215;--surface:#161a1e;--line:#272d33;--fg:#e7eaed;--muted:#8f9ba6;
  --accent:#7ea3f2;--accent-ink:#0f1215;--sel:#1b2536;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

h1{font-size:22px;font-weight:700;letter-spacing:-.01em}

p{margin:0}

section.blk{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}

.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:6px;cursor:pointer}

.flash{font:inherit;color:inherit;text-align:left;width:100%;min-height:230px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:24px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:12px}

.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}

.qhead{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.qhead .num{color:var(--muted)}
.qtag{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
h2.q{font-size:19px;font-weight:600;line-height:1.35}
blockquote{margin:0;padding:12px 14px;border-left:3px solid var(--line);background:var(--surface);border-radius:0 6px 6px 0;font-size:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;width:100%;background:var(--surface);border:1px solid var(--line);color:var(--fg);padding:11px 14px;border-radius:6px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:1px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--fg)}
.fillrow{display:flex;flex-wrap:wrap;gap:8px}
.fillrow input{flex:1 1 220px;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.fb{border-radius:6px;padding:12px 14px;font-size:14px;border:1px solid var(--line)}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.score{font-family:var(--mono);font-size:44px;font-weight:500;line-height:1}
.score span{font-size:22px;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:10px}
.miss{padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px;display:flex;flex-direction:column;gap:4px}
.miss .a{color:var(--ok)}
.miss .u{color:var(--bad)}
.selbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.selbar b{color:var(--fg)}
.pgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
.pgrid>div{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.pt,.pd{font:inherit;text-align:left;width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) 28px;gap:8px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);cursor:pointer;font-size:14px}
.pt .n,.pd .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pt .bdg,.pd .bdg{font-family:var(--mono);font-size:13px;font-weight:500;text-align:center;border-radius:4px;min-height:22px;line-height:22px}
.pt.paired .bdg,.pd.paired .bdg{background:var(--fg);color:var(--bg)}
.pt.sel{border-color:var(--accent);background:var(--sel)}
.pt.paired,.pd.paired{border-color:var(--muted)}
.pt.ok,.pd.ok{border-color:var(--ok);background:var(--ok-bg)}
.pt.bad,.pd.bad{border-color:var(--bad);background:var(--bad-bg)}
.pt small{display:block;color:var(--bad);margin-top:2px}
.sheet{display:flex;flex-direction:column;gap:28px}
.sheet section{display:flex;flex-direction:column;gap:10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child th,tr:first-child td{border-top:0}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
td code,.f{font-family:var(--mono);font-size:13px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cols3 .card ul,.sheet ul,.sheet ol{margin:6px 0 0;padding-left:18px}
.cols3 .card li,.sheet li{margin:2px 0}
.tag{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.rej{color:var(--bad);border-color:var(--bad)}
.tag.adv{color:var(--muted)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
'use strict';
/* ---------- Datos: 56 conceptos ---------- */
const C=[
["Aleatorio","Que ocurre de manera impredecible, sin seguir un patrón o dirección definida."],
["Calibración","Operación que establece la relación entre los valores de referencia y las indicaciones de un instrumento de medición."],
["Calibrador","Material con una concentración o valor conocido que se utiliza para ajustar un sistema de medición."],
["Conmutabilidad","Capacidad de un material de comportarse de manera similar a las muestras de pacientes en diferentes procedimientos de medición."],
["Corrida analítica","Conjunto de análisis realizados bajo condiciones definidas durante un período determinado, en los que se evalúa el desempeño del sistema."],
["Control de calidad","Conjunto de procedimientos destinados a detectar, evaluar y corregir errores para garantizar resultados confiables."],
["Control valorado","Material de control que tiene valores o concentraciones asignados conocidos, utilizados para evaluar el desempeño analítico."],
["Criterios de calidad","Requisitos o condiciones establecidos para determinar si un resultado o proceso cumple con los niveles de calidad aceptables."],
["Control de proceso","Supervisión de las actividades de un proceso para comprobar que funcionan dentro de los parámetros establecidos."],
["Error aleatorio","Variación impredecible de los resultados que afecta principalmente la precisión de las mediciones."],
["Error sistemático","Desviación constante o predecible de los resultados en una misma dirección, que afecta principalmente la exactitud."],
["Gestión de calidad","Actividades coordinadas para dirigir y controlar una organización en relación con la calidad."],
["Garantía externa de calidad","Evaluación externa del desempeño del laboratorio mediante comparación con otros laboratorios o valores de referencia."],
["Grupo par","Conjunto de laboratorios que utilizan métodos o sistemas de medición comparables para evaluar sus resultados."],
["Incertidumbre de medida","Parámetro que expresa la duda asociada al resultado de una medición."],
["Indicador de calidad","Medida utilizada para evaluar y supervisar el cumplimiento de los objetivos de calidad."],
["Magnitud","Propiedad de un fenómeno, cuerpo o sustancia que puede expresarse cuantitativamente."],
["Mensurando","Magnitud específica que se desea medir."],
["Patrón de medición","Referencia establecida que se utiliza para definir, realizar o reproducir una unidad de medida o un valor."],
["Procedimiento de medida","Descripción detallada de las operaciones utilizadas para realizar una medición."],
["Pruebas de evaluación externa de calidad","Pruebas en las que un laboratorio analiza muestras proporcionadas por una entidad externa y compara sus resultados con los de otros laboratorios o valores establecidos."],
["Reglas de control","Criterios estadísticos utilizados para determinar si una corrida analítica se acepta o se rechaza."],
["Sesgo","Diferencia entre el resultado analítico esperado y el valor de referencia aceptado."],
["Trazabilidad","Propiedad de un resultado de medición que permite relacionarlo con una referencia mediante una cadena documentada e ininterrumpida de calibraciones."],
["Variable","Característica que puede tomar diferentes valores o categorías."],
["Variable cuantitativa","Variable que se expresa mediante valores numéricos."],
["Variable cualitativa","Variable que representa características o categorías no numéricas."],
["Veracidad","Grado de concordancia entre el promedio de mediciones repetidas y un valor de referencia aceptado."],
["Cobertura","Alcance o proporción de los elementos, procesos o actividades que están incluidos dentro de un sistema o servicio."],
["Confiabilidad","Capacidad de un método o sistema para producir resultados consistentes y fiables."],
["Control de primera opinión","Material de control diseñado para utilizarse con un sistema analítico específico y cuya evaluación depende principalmente del fabricante."],
["Control de tercera opinión","Material de control independiente del fabricante, que permite evaluar el desempeño del sistema analítico de manera independiente."],
["Dato aberrante","Resultado que se encuentra considerablemente alejado del comportamiento esperado del conjunto de datos."],
["Desviación estándar","Medida estadística que indica cuánto se dispersan los resultados respecto a la media."],
["Error total analítico","Combinación del error aleatorio y el error sistemático presentes en una medición."],
["Error total permitido","Límite máximo de error que puede aceptarse en un resultado sin comprometer su utilidad clínica."],
["Especificidad","Capacidad de una prueba para identificar correctamente a las personas que no presentan una enfermedad."],
["Estado del arte","Conocimiento más actualizado y avanzado que existe sobre un tema o procedimiento."],
["Exactitud","Grado de concordancia entre un resultado de medición y el valor verdadero o de referencia aceptado."],
["Falso negativo","Resultado negativo en una persona que realmente presenta la enfermedad o condición evaluada."],
["Falso positivo","Resultado positivo en una persona que realmente no presenta la enfermedad o condición evaluada."],
["Imprecisión","Grado de dispersión entre resultados obtenidos al repetir una misma medición."],
["Interensayo","Variabilidad observada entre diferentes ensayos o corridas analíticas."],
["Intraensayo","Variabilidad observada entre mediciones repetidas dentro de un mismo ensayo o corrida analítica."],
["Linealidad","Capacidad de un método para producir resultados proporcionales a la concentración del analito dentro de un intervalo determinado."],
["Media","Promedio aritmético obtenido al sumar todos los valores y dividirlos entre el número de observaciones."],
["Moda","Valor que aparece con mayor frecuencia en un conjunto de datos."],
["Mediana","Valor central de un conjunto de datos ordenados."],
["Multicalibrador","Material que contiene varios analitos o concentraciones asignadas y permite calibrar diferentes parámetros de un sistema analítico."],
["Índice de desviación estándar (IDS)","Medida que expresa cuántas desviaciones estándar separan un resultado de la media o valor objetivo."],
["Nivel sigma","Indicador estadístico que expresa el desempeño de un proceso en función de sus defectos y variabilidad respecto a los límites de especificación."],
["Estándar","Material o referencia con un valor conocido que se utiliza como base para comparar o establecer mediciones."],
["Variabilidad analítica","Variación de los resultados causada por el método, instrumento, reactivos u otras condiciones del proceso analítico."],
["Variabilidad biológica","Variación natural de los componentes biológicos dentro de un mismo individuo o entre diferentes individuos."],
["Validación de métodos","Proceso que demuestra mediante evidencias que un método es adecuado para el uso previsto."],
["Target Score","Puntuación objetivo o valor de referencia que se utiliza para evaluar el desempeño alcanzado respecto a una meta establecida."]
];

/* ---------- Clase 1: opción múltiple [pregunta, correcta, 3 incorrectas] ---------- */
const M1=[
["La calidad de un laboratorio se define por…","la exactitud, fiabilidad y puntualidad de los resultados","el costo, la rapidez y el volumen de pruebas","el tamaño, el personal y la tecnología","la cantidad de normas ISO que cumple"],
["¿Quién definió la calidad como «apto para su uso»?","Juran","Crosby","Deming","ANSI/ASQC"],
["¿Quién definió la calidad como «conformidad con los requisitos»?","Crosby","Juran","Deming","Shewhart"],
["¿Quién afirma que la calidad debe estar dirigida a las necesidades del cliente?","Deming","Juran","Crosby","Ishikawa"],
["¿Quién define la calidad como la totalidad de rasgos y características de un producto o servicio que satisfacen necesidades dadas?","ANSI/ASQC","Juran","Crosby","Deming"],
["Un 99% de exactitud puede parecer aceptable, pero…","el 1% de error puede ser significativo en sistemas con muchas incidencias","el 1% se puede ignorar siempre","implica que el laboratorio no tiene errores","solo aplica a la fase postanalítica"],
["¿Cuál es un ejemplo de fase preanalítica?","Transporte de muestras","Validación técnica","Archivo de datos","Elaboración de informes"],
["¿Cuál es un ejemplo de fase analítica?","Validación técnica","Recepción de muestras","Almacén de resultados","Siembras"],
["¿Cuál es un ejemplo de fase postanalítica?","Almacén de resultados","Solicitud de análisis","Extracción de muestras","Urgencias"],
["Según las normas ISO, los procesos del laboratorio se dividen en…","3 fases","2 fases","4 fases","5 fases"],
["Una muestra dañada durante el transporte es un error de la fase…","preanalítica","analítica","postanalítica","no afecta al resultado"],
["Un informe retrasado, perdido o mal escrito es un error de la fase…","postanalítica","preanalítica","analítica","de calibración"],
["¿Cuál NO es una consecuencia negativa de un error de laboratorio?","Reducción de costos y de tiempo","Tratamientos innecesarios","Retrasos en el diagnóstico correcto","Pruebas diagnósticas adicionales innecesarias"],
["Un SGC se define como…","las actividades coordinadas para dirigir y controlar una organización con respecto a la calidad","el conjunto de pruebas de evaluación externa","la verificación de calibradores y controles","el archivo de todos los informes emitidos"],
["¿Cuántos elementos clave tiene el sistema de la calidad (modelo CLSI)?","12","8","10","15"],
["El producto principal del laboratorio es…","la información (informes de análisis)","los reactivos","las muestras","los equipos"],
["Una «incidencia» es…","un error o evento no deseado","un resultado crítico","una auditoría externa","un cambio de lote"],
["El recurso más importante del laboratorio es…","el personal competente y motivado","los equipos","los reactivos","las instalaciones"],
["¿Qué elemento compara el rendimiento del laboratorio con normas u otros laboratorios?","Evaluación","Organización","Gestión de incidencias","Servicio al cliente"],
["¿Qué elemento explica «cómo hacer las cosas»?","Documentos y registros","Gestión de la información","Evaluación","Compras e inventario"],
["¿Qué elemento incluye seguridad, contención y ergonomía?","Seguridad e instalaciones","Equipos","Organización","Personal"],

const mk=(pre,arr,tag)=>arr.map((r,i)=>({id:pre+i,type:'mc',tag,q:r[0],correct:r[1],wrong:r.slice(2,5),exp:''}));
const I1=mk('a',M1,'Clase 1'), I3=mk('b',M3,'Clase 3');
const ITF=TF.map((r,i)=>({id:'t'+i,type:'tf',tag:'Verdadero o falso',q:r[0],a:r[1],exp:r[2]}));
const IFILL=FILL.map((r,i)=>({id:'f'+i,type:'fill',tag:'Completar',q:r[0],ans:r[1],exp:r[2]}));
const REG={};[...I1,...I3,...ITF,...IFILL].forEach(x=>REG[x.id]=x);
const ALL=C.map((_,i)=>i);
function cItem(i,dir){
  const o=sample(ALL.filter(j=>j!==i),3);
  if(dir==='d')return{id:'k'+(i+1)+'d',type:'mc',tag:'Concepto',stem:C[i][1],q:'¿Qué concepto corresponde a esta definición?',correct:C[i][0],wrong:o.map(j=>C[j][0]),exp:''};
  return{id:'k'+(i+1)+'t',type:'mc',tag:'Concepto',q:'¿Cuál es la definición de «'+C[i][0]+'»?',correct:C[i][1],wrong:o.map(j=>C[j][1]),exp:''};
}
function getItem(id){
  const m=/^k(\d+)([dt])$/.exec(id);
  if(m)return cItem(+m[1]-1,m[2]);
  return REG[id]?Object.assign({},REG[id]):null;
}

  keyHandler=null;

function listHtml(idx){

function cardHtml(){

function again(){if(M.deck.length>1)M.deck.push(M.deck.shift());M.flip=false;drawMem();}
function got(){const i=M.deck.shift();if(i!=null){S.known[i+1]=true;save();}M.flip=false;drawMem();}
function keepScroll(f){const y=window.scrollY;f();window.scrollTo(0,y);}

/* ---------- Motor de preguntas ---------- */
let Q=null;
function runQuiz(cfg){
  Q={title:cfg.title,key:cfg.key||null,extra:cfg.extra||null,back:cfg.back||'quiz',t0:Date.now(),i:0,res:[],answered:false,
     items:cfg.items.map(x=>{const c=Object.assign({},x);if(c.type==='mc')c.opts=shuffle([c.correct,...c.wrong]);return c;})};
  if(!Q.items.length){app.innerHTML='<p class="empty">No hay preguntas en este grupo todavía.</p>';return;}
  drawQ();
}
function drawQ(){
  const it=Q.items[Q.i],n=Q.items.length;
  Q.answered=false;
  let body;
  if(it.type==='mc')body=it.opts.map((o,k)=>`<button class="opt" data-act="opt" data-k="${k}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join('');
  else if(it.type==='tf')body=['Verdadero','Falso'].map((o,k)=>`<button class="opt" data-act="opt" data-k="${k}"><span class="k">${k?'F':'V'}</span><span>${o}</span></button>`).join('');
  else body=`<div class="fillrow"><input id="fill" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe tu respuesta" aria-label="Respuesta"><button class="btn primary" data-act="check">Comprobar</button></div>`;
  app.innerHTML=`<section class="blk">
    <div class="qhead"><span>${esc(Q.title)}</span><span class="num">${Q.i+1} / ${n}</span></div>
    <div class="bar"><i style="width:${pct(Q.i,n)}%"></i></div>
    <div class="qtag">${esc(it.part?it.part:it.tag)}</div>
    ${it.stem?`<blockquote>${esc(it.stem)}</blockquote>`:''}
    <h2 class="q">${esc(it.q)}</h2>
    <div class="opts">${body}</div>
    <div id="fb"></div>
  </section>`;
  const inp=$('#fill');if(inp)inp.focus();
  keyHandler=e=>{
    if(e.target.tagName==='INPUT'){if(e.key==='Enter'){e.preventDefault();Q.answered?nextQ():checkFill();}return;}
    if(Q.answered){if(e.key==='Enter'||e.key===' '){e.preventDefault();nextQ();}return;}
    if(it.type==='mc'&&/^[1-4]$/.test(e.key))pick(+e.key-1);
    if(it.type==='tf'){const k=e.key.toLowerCase();if(k==='v'||k==='1')pick(0);if(k==='f'||k==='2')pick(1);}
  };
}
function record(ok,given){
  const it=Q.items[Q.i];Q.answered=true;Q.res.push({it,ok,given});
  if(ok)delete S.missed[it.id];else S.missed[it.id]=1;save();
}
function answerText(it){return it.type==='mc'?it.correct:it.type==='tf'?(it.a?'Verdadero':'Falso'):it.ans[0];}
function showFb(ok,fill){
  const it=Q.items[Q.i],last=Q.i===Q.items.length-1;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correcto':'Incorrecto'}</b>${ok?'':'Respuesta: '+esc(answerText(it))+'. '}${it.exp?esc(it.exp):''}</div>
  <div class="actions">${fill&&!ok?'<button class="btn" data-act="override">Marcar como correcta</button>':''}<button class="btn primary" data-act="next">${last?'Ver resultado':'Siguiente'}</button></div>`;
}
function pick(k){
  if(Q.answered)return;
  const it=Q.items[Q.i];let ok,given;
  if(it.type==='mc'){given=it.opts[k];ok=given===it.correct;}else{given=k===0;ok=given===it.a;}
  record(ok,it.type==='mc'?given:(given?'Verdadero':'Falso'));
  document.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled=true;
    const right=it.type==='mc'?it.opts[j]===it.correct:(j===0)===it.a;
    if(right)b.classList.add('ok');else if(j===k)b.classList.add('bad');
  });
  showFb(ok);
}
function checkFill(){
  if(Q.answered)return;
  const inp=$('#fill'),v=inp.value;if(!norm(v))return;
  const it=Q.items[Q.i];
  const ok=it.ans.some(a=>norm(a)===norm(v));
  record(ok,v);inp.readOnly=true;showFb(ok,true);
}
function nextQ(){Q.i++;if(Q.i>=Q.items.length)finishQ();else drawQ();}
function finishQ(){
  keyHandler=null;
  const n=Q.items.length,ok=Q.res.filter(r=>r.ok).length;
  const ex=Q.extra,score=ok+(ex?ex.score:0),total=n+(ex?ex.total:0),p=pct(score,total);
  setBest(Q.key,p);
  const wrong=Q.res.filter(r=>!r.ok);
  const parts={};Q.res.forEach(r=>{const k=r.it.part;if(k){parts[k]=parts[k]||[0,0];parts[k][1]++;if(r.ok)parts[k][0]++;}});
  const mins=Math.max(1,Math.round((Date.now()-Q.t0)/60000));
  const partsHtml=(ex||Object.keys(parts).length)?`<div class="tw"><table><tr><th>Parte</th><th>Puntaje</th></tr>${ex?`<tr><td>${esc(ex.label)}</td><td class="f">${ex.score} / ${ex.total}</td></tr>`:''}${Object.keys(parts).map(k=>`<tr><td>${esc(k)}</td><td class="f">${parts[k][0]} / ${parts[k][1]}</td></tr>`).join('')}</table></div>`:'';
  app.innerHTML=`<section class="blk">
    <div class="card res"><h3>${esc(Q.title)}</h3><div class="score">${score}<span> / ${total}</span></div><p class="muted">${p}% de aciertos${Q.key==='sim'?' · '+mins+' min':''}</p>${partsHtml}
    <div class="actions">${wrong.length?'<button class="btn primary" data-act="retry">Repetir las falladas</button>':''}<button class="btn" data-act="qback">Volver</button></div></div>
    ${wrong.length?`<h3>Para repasar (${wrong.length})</h3><div class="res">${wrong.map(r=>`<div class="miss"><span>${r.it.stem?'<i>'+esc(r.it.stem)+'</i><br>':''}${esc(r.it.q)}</span><span class="u">Tu respuesta: ${esc(r.given)}</span><span class="a">Correcta: ${esc(answerText(r.it))}</span></div>`).join('')}</div>`:'<p class="empty">Sin errores. Buen trabajo.</p>'}
  </section>`;
  Q.wrongItems=wrong.map(r=>r.it);
}

/* ---------- Pareo ---------- */
let PA=null,pScope='all';
function runPareo(cfg){
  const sh=shuffle(cfg.idxs),ch=[];
  for(let i=0;i<sh.length;i+=cfg.size)ch.push(sh.slice(i,i+cfg.size));
  if(ch.length>1&&ch[ch.length-1].length<3){const l=ch.pop();ch[ch.length-1]=ch[ch.length-1].concat(l);}
  PA={cfg,chunks:ch,r:0,score:0,total:0};
  startRound();
}
function startRound(){
  PA.terms=PA.chunks[PA.r];PA.defs=shuffle(PA.terms);PA.assign={};PA.sel=null;PA.graded=false;PA.roundScore=0;
  drawPareo();
}
const LET=j=>String.fromCharCode(65+j);
function drawPareo(){
  const {terms,defs,assign,sel,graded}=PA;
  const inv={};Object.keys(assign).forEach(t=>inv[assign[t]]=+t);
  const paired=Object.keys(assign).length;
  const bar=graded?`Ronda calificada: <b>${PA.roundScore} / ${terms.length}</b>`:sel!==null?`Término seleccionado: <b>${sel+1}. ${esc(C[terms[sel]][0])}</b>. Elige su definición.`:'Toca un término y luego su definición. Toca una pareja para deshacerla.';
  const tHtml=terms.map((t,i)=>{
    let cls=sel===i?'sel':'';if(assign[i]!==undefined)cls+=' paired';
    let extra='';
    if(graded){const ok=assign[i]!==undefined&&defs[assign[i]]===t;cls=ok?'ok':'bad';if(!ok)extra=`<small>Correcta: ${LET(defs.indexOf(t))}</small>`;}
    return `<button class="pt ${cls}" data-act="pt" data-i="${i}"><span class="n">${i+1}</span><span>${esc(C[t][0])}${extra}</span><span class="bdg">${assign[i]!==undefined?LET(assign[i]):''}</span></button>`;
  }).join('');
  const dHtml=defs.map((d,j)=>{
    let cls=inv[j]!==undefined?'paired':'';
    if(graded&&inv[j]!==undefined)cls=terms[inv[j]]===d?'ok':'bad';
    return `<button class="pd ${cls}" data-act="pd" data-j="${j}"><span class="n">${LET(j)}</span><span>${esc(C[d][1])}</span><span class="bdg">${inv[j]!==undefined?inv[j]+1:''}</span></button>`;
  }).join('');
  const last=PA.r+1>=PA.chunks.length;
  app.innerHTML=`<section class="blk">
    <div class="qhead"><span>${esc(PA.cfg.title)}</span><span class="num">ronda ${PA.r+1} / ${PA.chunks.length}</span></div>
    <div class="selbar">${bar}</div>
    <div class="pgrid"><div><h3>Conceptos</h3>${tHtml}</div><div><h3>Definiciones</h3>${dHtml}</div></div>
    <div class="actions">${graded?`<button class="btn primary" data-act="pnext">${last?'Ver resultado':'Siguiente ronda'}</button>`:`<button class="btn primary" data-act="pgrade">Calificar (${paired}/${terms.length} unidos)</button>`}</div>
  </section>`;
}
function pareoClick(kind,n){
  if(!PA||PA.graded)return;
  const a=PA.assign;
  if(kind==='pt'){
    PA.sel=PA.sel===n?null:n;
  }else{
    const owner=Object.keys(a).find(t=>a[t]===n);
    if(PA.sel===null){if(owner!==undefined)delete a[owner];}
    else{if(owner!==undefined)delete a[owner];a[PA.sel]=n;PA.sel=null;}
  }
  keepScroll(drawPareo);
}
function gradePareo(){
  if(PA.graded)return;
  let c=0;
  PA.terms.forEach((t,i)=>{
    const ok=PA.assign[i]!==undefined&&PA.defs[PA.assign[i]]===t;
    const id='k'+(t+1)+'d';
    if(ok){c++;delete S.missed[id];}else S.missed[id]=1;
  });
  PA.roundScore=c;PA.score+=c;PA.total+=PA.terms.length;PA.graded=true;save();
  drawPareo();window.scrollTo(0,0);
}
function nextRound(){
  if(PA.r+1<PA.chunks.length){PA.r++;startRound();window.scrollTo(0,0);}
  else finishPareo();
}
function finishPareo(){
  if(PA.cfg.onDone){PA.cfg.onDone(PA.score,PA.total);return;}
  const p=pct(PA.score,PA.total);setBest(PA.cfg.key,p);
  app.innerHTML=`<section class="blk"><div class="card res"><h3>${esc(PA.cfg.title)}</h3><div class="score">${PA.score}<span> / ${PA.total}</span></div><p class="muted">${p}% de parejas correctas</p>
  <div class="actions"><button class="btn primary" data-act="pareo" data-scope="${pScope}">Otra vuelta</button><button class="btn" data-act="go" data-v="quiz">Ir al quiz</button></div></div></section>`;
}
function vPareo(){
  if(ctx.scope){pScope=ctx.scope;ctx={};startPareo();return;}
  const b=k=>S.best[k]!=null?` Mejor resultado: ${S.best[k]}%.`:'';
  app.innerHTML=`<section class="blk"><div><h2>Pareo</h2><p class="muted">Rondas de 8 conceptos y 8 definiciones mezcladas, como en el parcial. Une cada concepto con su letra.${b('pareo'+pScope)}</p></div>

}

  <tr><td>Otras</td><td>CAP, The Joint Commission, COLA, OMS</td></tr>
  <tr><td>Shewhart</td><td>Década de 1920: gestión de procesos estadísticos; en laboratorios desde la de 1940</td></tr>
  <tr><td>Otros innovadores</td><td>Feigenbaum, Ishikawa, Taguchi; Galvin (reducción de errores a microescala)</td></tr></table></div></section>

  <section><h2>CCI frente a CCE</h2>
  <div class="tw"><table>
  <tr><th></th><th>Interno (CCI)</th><th>Externo (CCE)</th></tr>
  <tr><td>Momento</td><td>Prospectivo</td><td>Retrospectivo</td></tr>
  <tr><td>Evalúa</td><td>Precisión y estabilidad</td><td>Exactitud</td></tr>
  <tr><td>Cómo</td><td>Junto con las muestras de pacientes</td><td>Comparación entre laboratorios</td></tr></table></div></section>

  <section><h2>Calibrador, control, primera y tercera opinión</h2>
  <div class="tw"><table>
  <tr><th></th><th>Calibrador</th><th>Control</th></tr>
  <tr><td>Para qué</td><td>Ajustar el sistema de medición</td><td>Verificar de forma independiente que el sistema funciona</td></tr>
  <tr><td>Origen</td><td>Generalmente del fabricante</td><td>Debe ser distinto del calibrador</td></tr></table></div>
  <div class="tw"><table>
  <tr><th></th><th>Primera opinión</th><th>Tercera opinión</th></tr>
  <tr><td>Diseño</td><td>Para un sistema específico</td><td>No optimizado para un sistema</td></tr>
  <tr><td>Evaluación</td><td>Depende del fabricante</td><td>Independiente del fabricante</td></tr>
  <tr><td>Sensibilidad a cambios</td><td>Menor</td><td>Mayor</td></tr>
  <tr><td>Lote</td><td>Suele cambiar con el lote de reactivo</td><td>Mismo lote por periodo prolongado</td></tr>
  <tr><td>Extras</td><td>CCI limitado</td><td>Matriz humana, comparación entre laboratorios, Seis Sigma</td></tr></table></div></section>

  <section><h2>Fórmulas</h2>
  <div class="tw"><table>
  <tr><td>Media</td><td class="f">X̄ = (X₁ + X₂ + … + Xₙ) / n</td></tr>
  <tr><td>Desviación estándar</td><td class="f">s = √[ Σ(Xᵢ − X̄)² / (n − 1) ]</td></tr>
  <tr><td>Coeficiente de variación</td><td class="f">CV (%) = (s / X̄) × 100</td></tr>
  <tr><td>Sesgo</td><td class="f">resultado esperado − valor de referencia</td></tr>
  <tr><td>IDS</td><td class="f">(resultado − media) / s</td></tr>
  <tr><td>Límites de control</td><td class="f">X̄ ± 1s, X̄ ± 2s, X̄ ± 3s</td></tr>
  <tr><td>Distribución normal</td><td class="f">±1s ≈ 68.3% · ±2s ≈ 95.5% · ±3s ≈ 99.7%</td></tr></table></div>
  <p class="muted">Ejemplo del resumen: datos 4.0, 4.1, 4.0, 4.2, 4.1, 4.1, 4.2. Media 4.1 y s 0.1. Entonces ±1s = 4.0 a 4.2, ±2s = 3.9 a 4.3, ±3s = 3.8 a 4.4 y CV ≈ 2.44%. CV deseable: menor que 5%.</p>
  <p class="muted">Diseño del CCI: verificar equipo y reactivos, estandarizar, analizar controles al menos 20 días, revisar valores aberrantes (más de 2 en 20 invalida los datos), calcular media, DE y CV, IDS, graficar Levey-Jennings y aplicar Westgard.</p></section>

  <section><h2>Reglas de Westgard</h2>
  <div class="tw"><table>
  <tr><th>Regla</th><th>Qué significa</th><th>Tipo</th><th>Decisión</th></tr>
  <tr><td class="f">1₂ₛ</td><td>Un resultado supera ±2s</td><td>—</td><td><span class="tag adv">Advertencia</span></td></tr>
  <tr><td class="f">1₃ₛ</td><td>Un resultado supera ±3s</td><td>Aleatorio</td><td><span class="tag rej">Rechazo</span></td></tr>
  <tr><td class="f">2₂ₛ</td><td>Dos consecutivos superan 2s del mismo lado</td><td>Sistemático</td><td><span class="tag rej">Rechazo</span></td></tr>
  <tr><td class="f">R₄ₛ</td><td>Dos controles de la misma corrida difieren más de 4s</td><td>Aleatorio</td><td><span class="tag rej">Rechazo</span></td></tr>
  <tr><td class="f">4₁ₛ</td><td>Cuatro consecutivos superan 1s del mismo lado</td><td>Sistemático</td><td><span class="tag rej">Rechazo</span></td></tr>
  <tr><td class="f">10ₓ</td><td>Diez consecutivos del mismo lado de la media</td><td>Sistemático</td><td><span class="tag rej">Rechazo</span></td></tr></table></div>
  <p class="muted">Ante un rechazo: no liberar resultados, revisar controles, reactivos e instrumento, investigar calibración, pipeteo, temperatura, tiempo y lotes, corregir y repetir los controles.</p></section>

  <section><h2>Errores</h2>
  <div class="tw"><table>
  <tr><th></th><th>Aleatorio</th><th>Sistemático</th></tr>
  <tr><td>Qué es</td><td>Variación impredecible, alta o baja</td><td>Desviación constante en una dirección</td></tr>
  <tr><td>Afecta</td><td>Precisión</td><td>Exactitud</td></tr>
  <tr><td>Se ve como</td><td>Dispersión irregular</td><td>Desplazamiento o tendencia</td></tr>
  <tr><td>Causas</td><td>Pipeteo, tiempo, temperatura, luz, inestabilidad ocasional</td><td>Calibración, cambio de lote (reactivo, calibrador, control), instrumento, preparación incorrecta</td></tr></table></div>
  <div class="tw"><table>
  <tr><td>Error alfa</td><td>Falso rechazo de una corrida aceptable</td></tr>
  <tr><td>Error beta</td><td>Falsa aceptación de una corrida con problema</td></tr>
  <tr><td>Error imperdonable</td><td>No realizar el control de calidad</td></tr>
  <tr><td>Error perverso</td><td>Hacer el control y no revisar ni interpretar sus resultados</td></tr></table></div></section>
  </div>`;
}

  mgo:d=>nav(d.v),

  retry:()=>runQuiz({items:Q.wrongItems,title:'Repaso de falladas',key:null,back:Q.back}),
  qback:()=>nav(Q&&Q.back||'quiz'),
  pt:d=>pareoClick('pt',+d.i),

render();
